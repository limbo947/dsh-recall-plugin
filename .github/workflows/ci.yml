name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests + pack layout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dev deps only
        # 项目 peerDeps 是私有 @deepseek-ai 包（CI 不可得），--legacy-peer-deps
        # 跳过、只装 devDependencies（vitest）；发布仍走现有手动流程。
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        # 置于单测之前：tests/types 编译期断言（M3 起）漏跑即假绿，顺序写死
        run: npm run typecheck
      - name: Unit tests
        # 单测里的 package-layout.test.js 已跑 npm pack --dry-run 断言包内容，
        # 无需单独 shell 步骤（计划原文：测试形式比 shell 步骤更可移植）。
        run: npm test
      - name: Bundle freshness gate
        # 统一产物新鲜度门禁：改 src/ 忘 rebuild 时 lib/ 产物陈旧可静默合入
        # 并随发布流出（host 13 产物 + client.js 合并为一道）。esbuild 在
        # devDependencies（上面已装），同版本输出确定性可依赖——rebuild 后
        # 产物必须与提交内容逐字一致，否则红。build-client.mjs 自带的包裹
        # 格式/id/require 白名单断言同时充当 client 产物质量冒烟。
        run: |
          npm run build
          git diff --exit-code lib/