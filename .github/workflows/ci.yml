name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests + pack layout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dev deps only
        # 项目 peerDeps 是私有 @deepseek-ai 包（CI 不可得），--legacy-peer-deps
        # 跳过、只装 devDependencies（vitest）；发布仍走现有手动流程。
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        # 置于单测之前：tests/types 编译期断言（M3 起）漏跑即假绿，顺序写死
        run: npm run typecheck
      - name: Unit tests
        # 单测里的 package-layout.test.js 已跑 npm pack --dry-run 断言包内容，
        # 无需单独 shell 步骤（计划原文：测试形式比 shell 步骤更可移植）。
        run: npm test
      - name: Client bundle freshness gate
        # F-G6 产物新鲜度门禁：改 src/client/ 忘 rebuild 时 lib/client.js 陈旧
        # 可静默合入并随发布流出。esbuild 在 devDependencies（上面已装），
        # 同版本输出确定性可依赖——rebuild 后产物必须与提交内容逐字一致，
        # 否则红。build-client.mjs 自带的包裹格式/id/require 白名单断言同时
        # 充当产物质量冒烟。
        run: |
          node scripts/build-client.mjs
          git diff --exit-code lib/client.js